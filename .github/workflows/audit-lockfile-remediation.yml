name: One-time safe dependency lockfile remediation

on:
  push:
    branches:
      - feature/gg-global-map-tenancy-foundation
    paths:
      - .github/workflows/audit-lockfile-remediation.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply only semver-compatible advisory fixes
        run: npm audit fix --package-lock-only --ignore-scripts --audit-level=critical
      - name: Commit lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No compatible dependency lockfile updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): apply non-forced audit fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
