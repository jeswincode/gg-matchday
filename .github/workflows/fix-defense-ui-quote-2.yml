name: Fix defensive UI quote 2
on:
  push:
    branches: [feature/defensive-performance-rating]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix defensive UI quote 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/App.jsx');s=p.read_text()
          pattern=r'    setDefensivePerformances\(Object\.fromEntries\(\(match\.participants\|\|\[\]\)\.map\(p=>\[String\(p\.player\?\._id\|\|p\.player\),p\.defensivePerformance\?\?.*?\]\)\)\);'
          repl='    setDefensivePerformances(Object.fromEntries((match.participants||[]).map(p=>[String(p.player?._id||p.player),p.defensivePerformance??""])));'
          s,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit('Could not normalize defensive edit state')
          p.write_text(s)
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Fix defensive UI quote 2'
          git rm .github/workflows/fix-defense-ui-quote-2.yml
          git commit -m 'Remove temporary quote fix workflow 2'
          git push
