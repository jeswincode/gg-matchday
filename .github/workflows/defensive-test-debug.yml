name: Defensive Test Debug
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core formula
            pattern: 'statistics derive results'
          - name: formula weights
            pattern: 'defensive rating is 70%'
          - name: win rate isolation
            pattern: 'win rate no longer'
          - name: zero legacy
            pattern: 'defensive score zero'
          - name: cohort
            pattern: 'absolute and do not depend'
          - name: unrated
            pattern: 'unrated legacy'
          - name: draws
            pattern: 'draws are neutral'
          - name: periods
            pattern: 'year and month'
          - name: eligibility
            pattern: 'eligibility differs'
          - name: clasico
            pattern: 'El Clasico matching'
          - name: mandatory fields
            pattern: 'new match ratings'
          - name: own goals
            pattern: 'own goals subtract'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-name-pattern "${{ matrix.pattern }}" tests/statistics.test.js
