name: Apply own goal implementation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'Implement own goals in React recorder' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch React recorder and detail UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          text = app.read_text()
          old = '''  const [\n    assists,\n    setAssists,\n  ] = useState({});'''
          new = old + '''\n\n  const [\n    ownGoals,\n    setOwnGoals,\n  ] = useState({});'''
          if 'const [\n    ownGoals,\n    setOwnGoals' not in text:
              text = text.replace(old, new, 1)
          text = text.replace('''    setGoals({});\n    setAssists({});\n    setRatings({});''', '''    setGoals({});\n    setAssists({});\n    setOwnGoals({});\n    setRatings({});''', 1)
          text = text.replace('''    const nextAssists =\n      {};\n\n    for (\n      const participant of''', '''    const nextAssists =\n      {};\n\n    const nextOwnGoals =\n      {};\n\n    for (\n      const participant of''', 1)
          text = text.replace('''        nextTeams[\n          String(id)\n        ] =\n          participant.team;\n      }\n    }''', '''        nextTeams[\n          String(id)\n        ] =\n          participant.team;\n        nextOwnGoals[String(id)] = Number(participant.ownGoals || 0);\n      }\n    }''', 1)
          text = text.replace('''    setAssists(\n      nextAssists\n    );\n\n    setActiveTab(''', '''    setAssists(\n      nextAssists\n    );\n\n    setOwnGoals(\n      nextOwnGoals\n    );\n\n    setActiveTab(''', 1)
          score_pattern = re.compile(r'''  const teamAScore =\n    teamAPlayers\.reduce\([\s\S]*?\n  const totalGoals =\n    teamAScore \+\n    teamBScore;''')
          score_replacement = '''  const teamANormalScore =\n    teamAPlayers.reduce(\n      (total, player) =>\n        total + (goals[String(player._id)] || 0),\n      0\n    );\n\n  const teamBNormalScore =\n    teamBPlayers.reduce(\n      (total, player) =>\n        total + (goals[String(player._id)] || 0),\n      0\n    );\n\n  const teamAOwnGoals =\n    teamBPlayers.reduce(\n      (total, player) =>\n        total + (ownGoals[String(player._id)] || 0),\n      0\n    );\n\n  const teamBOwnGoals =\n    teamAPlayers.reduce(\n      (total, player) =>\n        total + (ownGoals[String(player._id)] || 0),\n      0\n    );\n\n  const teamAScore = teamANormalScore + teamAOwnGoals;\n  const teamBScore = teamBNormalScore + teamBOwnGoals;\n\n  const totalGoals =\n    teamAScore +\n    teamBScore;'''
          text, count = score_pattern.subn(score_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch score calculation')
          text = text.replace('''              rating: ratings[String(player._id)] === "" || ratings[String(player._id)] == null ? null : Number(ratings[String(player._id)]),\n              team:''', '''              rating: ratings[String(player._id)] === "" || ratings[String(player._id)] == null ? null : Number(ratings[String(player._id)]),\n              ownGoals: ownGoals[String(player._id)] || 0,\n              team:''', 1)
          text = text.replace('''<span>Goals</span><span>Assists</span><span>Rating</span>''', '''<span>Goals</span><span>Assists</span><span>Own Goal</span><span>Rating</span>''', 1)
          text = text.replace('''[[goals,setGoals,'Goals'],[assists,setAssists,'Assists']].map''', '''[[goals,setGoals,'Goals'],[assists,setAssists,'Assists'],[ownGoals,setOwnGoals,'Own Goal']].map''', 1)
          app.write_text(text)

          css = Path('src/v1.4-record.css')
          c = css.read_text()
          c = c.replace('grid-template-columns: minmax(170px, 1.5fr) 90px 130px 130px;', 'grid-template-columns: minmax(170px, 1.5fr) 90px 120px 120px 120px;', 1)
          c = c.replace('grid-template-columns: minmax(130px, 1fr) 72px 92px 92px;', 'grid-template-columns: minmax(130px, 1fr) 72px 82px 82px 100px;', 1)
          c = c.replace('''      "player side"\n      "goals assists";''', '''      "player side"\n      "goals assists"\n      "own-goal rating";''', 1)
          c = c.replace('''  .v14-counter-cell:nth-child(4) {\n    grid-area: assists;\n  }''', '''  .v14-counter-cell:nth-child(4) {\n    grid-area: assists;\n  }\n\n  .v14-counter-cell:nth-child(5) {\n    grid-area: own-goal;\n  }''', 1)
          c = c.replace('''  .v14-counter-cell:nth-child(4)::before {\n    content: "ASSISTS";\n  }''', '''  .v14-counter-cell:nth-child(4)::before {\n    content: "ASSISTS";\n  }\n\n  .v14-counter-cell:nth-child(5)::before {\n    content: "OWN GOAL";\n  }''', 1)
          css.write_text(c)

          detail = Path('src/components/MatchDetail.jsx')
          d = detail.read_text()
          d = d.replace('<th>Goals</th><th>Assists</th><th>Rating</th>', '<th>Goals</th><th>Own Goals</th><th>Assists</th><th>Rating</th>', 1)
          d = d.replace("<td>{total(p.player,'goal')}</td><td>{total(p.player,'assist')}</td>", "<td>{total(p.player,'goal')}</td><td>{p.ownGoals || 0}</td><td>{total(p.player,'assist')}</td>", 1)
          detail.write_text(d)
          PY
      - name: Validate changed source
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/v1.4-record.css src/components/MatchDetail.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Implement own goals in React recorder"
          git push
