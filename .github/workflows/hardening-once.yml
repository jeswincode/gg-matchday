name: GG Matchday hardening once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate hardening script
        run: node --check scripts/harden-application.mjs
      - name: Apply hardening
        run: node scripts/harden-application.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node --check server/server.js
      - run: node --check server/routes/profileSecurity.js
      - run: node --check server/routes/profileRequests.js
      - name: Remove one-time hardening helpers
        run: |
          rm -f scripts/harden-application.mjs .github/workflows/hardening-once.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply application hardening"
          git push
