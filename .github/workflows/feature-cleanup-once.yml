name: Feature cleanup once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/cleanup-features.mjs
      - run: node scripts/finalize-no-selfremove.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node --check server/server.js
      - run: node --check server/routes/profileSecurity.js
      - run: node --check server/routes/profileRequests.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove gallery and likes features"
          git push
