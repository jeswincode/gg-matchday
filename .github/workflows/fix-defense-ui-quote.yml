name: Fix defensive UI quote
on:
  push:
    branches: [feature/defensive-performance-rating]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix defensive UI quote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx');s=p.read_text()
          s=s.replace('p.defensivePerformance??"\\\"]', 'p.defensivePerformance??"\\"]')
          p.write_text(s)
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Fix defensive UI quote'
          git rm .github/workflows/fix-defense-ui-quote.yml
          git commit -m 'Remove temporary quote fix workflow'
          git push
