name: Cleanup removed features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          for path in ['server/models/Gallery.js','server/models/Like.js','server/routes/gallery.js','server/routes/interactions.js','src/components/LikeButton.jsx','.github/cleanup-trigger.txt']:
              p=root/path
              if p.exists(): p.unlink()

          def edit(path, fn):
              p=root/path; s=p.read_text(); n=fn(s); p.write_text(n)

          edit('server/app.js', lambda s: s.replace('import galleryRoutes from "./routes/gallery.js";\n','').replace('import interactionRoutes from "./routes/interactions.js";\n','').replace('app.use("/api/interactions", interactionRoutes);\n','').replace('app.use("/api/gallery", galleryRoutes);\n',''))

          def stats(s):
              s=s.replace("import Gallery from '../models/Gallery.js';\n",'')
              s=re.sub(r"router\.get\('/overview'.*?\n", "router.get('/overview',safe(async(req,res)=>{const [players,matches,goals]=await Promise.all([Player.countDocuments(),Match.countDocuments(),Match.aggregate([{$group:{_id:null,total:{$sum:{$add:['$teamA.score','$teamB.score']}}}}])]);res.json({players,matches,goals:goals[0]?.total||0});}));\n", s, count=1)
              return s
          edit('server/routes/stats.js',stats)

          def tests(s):
              s=s.replace("const {default:Like}=await import('../server/models/Like.js');",'').replace("const {default:Gallery}=await import('../server/models/Gallery.js');",'').replace(',Like,Gallery,ProfileChangeRequest',',ProfileChangeRequest')
              s=re.sub(r"test\('gallery associations validated; immutable likes deduplicated concurrently'.*?\);\n",'',s)
              return s
          edit('tests/api.test.js',tests)

          def perf(s):
              s=s.replace('const isGalleryImage = Boolean(/gallery/i.test(src || ""));\n','')
              s=s.replace('image.loading = "lazy";\n','')
              s=s.replace('isProfileImage ? 480 : isGalleryImage ? 900 : 1200','isProfileImage ? 480 : 1200')
              return s
          edit('src/v1.2-performance.js',perf)

          def app(s):
              s=s.replace("import LikeButton from './components/LikeButton';\n",'')
              s=s.replace("import Clasico from './components/Clasico';\n", "import Clasico from './components/Clasico';\nimport PlayerComparisons from './components/PlayerComparisons';\n")
              s=s.replace('  GALLERY: "gallery",\n','')
              for block in [
                "  const [galleryNext,setGalleryNext]=useState(null);\n  const [galleryMatch,setGalleryMatch]=useState('');\n  const [galleryPlayers,setGalleryPlayers]=useState([]);\n",
                "  const [\n    gallery,\n    setGallery,\n  ] = useState([]);\n",
                "  const [\n    galleryLoading,\n    setGalleryLoading,\n  ] = useState(true);\n\n  // =========================================================\n  // GALLERY\n  // =========================================================\n\n  const [\n    galleryFile,\n    setGalleryFile,\n  ] = useState(null);\n\n  const [\n    galleryCaption,\n    setGalleryCaption,\n  ] = useState(\"\");\n\n  const [\n    galleryUploading,\n    setGalleryUploading,\n  ] = useState(false);\n",
              ]: s=s.replace(block,'')
              s=s.replace('    loadGallery();\n','')
              s=re.sub(r"\n  async function loadGallery\(page = 1\) \{.*?\n  async function loadLeaderboard", "\n  async function loadLeaderboard", s, flags=re.S)
              s=re.sub(r"\n  // =========================================================\n  // GALLERY\n  // =========================================================\n\n  async function uploadGalleryPhoto\(\) \{.*?\n  // =========================================================\n  // ADMIN", "\n  // =========================================================\n  // ADMIN", s, flags=re.S)
              s=s.replace('Matches, players, rankings, photos and\n              every part','Matches, players, rankings and\n              every part')
              s=re.sub(r"\n            <HomeStat\n              label=\"PHOTOS\"\n              value=\{\n                overview\?\.photos \?\? gallery\.length\n              \}\n            />",'',s)
              s=re.sub(r"\n                        <LikeButton type=\"news\" id=\{article\._id\} isSignedIn=\{isSignedIn\}/>",'',s)
              s=re.sub(r"\n              action=\"Open Gallery\"\n              onAction=\{\(\) =>\n                setActiveTab\(\n                  TABS\.GALLERY\n                \)\n              \}",'',s)
              s=re.sub(r"\n        <section className=\"card quick-gallery-card\">.*?</section>",'',s,flags=re.S)
              s=re.sub(r"\n          <section className=\"home-section\">\n\n            <SectionHeading\n              eyebrow=\"GG MOMENTS\"\n              title=\"Latest Photos\".*?\n          </section>\n\n          \{leaderboard\.length >", "\n          <PlayerComparisons players={players} statistics={leaderboard} onPlayer={(playerId) => showPlayer(playerId)} />\n\n          {leaderboard.length >", s, count=1, flags=re.S)
              s=re.sub(r"\n      /\* =====================================================\n          GALLERY\n      =====================================================\n      \*/.*?\n      /\* =====================================================\n          ADMIN", "\n      /\* =====================================================\n          ADMIN", s, count=1, flags=re.S)
              s=s.replace('View Gallery','')
              s=s.replace('              <LikeButton type="gallery" id={photo._id} isSignedIn={isSignedIn}/>\n','')
              return s
          edit('src/App.jsx',app)

          edit('.env.example',lambda s:s.replace('\nVITE_CLOUDINARY_CLOUD_NAME=\nVITE_CLOUDINARY_UPLOAD_PRESET=gg-matchday-gallery\n','\n'))
          edit('README.md',lambda s:s.replace(', gallery associations, immutable likes,',','))

          css_terms=('gallery','like')
          for p in (root/'src').rglob('*.css'):
              s=p.read_text(); out=[]; pos=0
              for m in re.finditer(r'([^{}]+)\{([^{}]*)\}',s):
                  out.append(s[pos:m.start()]); selector=m.group(1); body=m.group(2)
                  parts=[x.strip().lower() for x in selector.split(',') if x.strip()]
                  if not parts or not all(any(t in x for t in css_terms) for x in parts): out.append(m.group(0))
                  pos=m.end()
              out.append(s[pos:]); p.write_text(''.join(out))
          PY

      - name: Add player comparison shell
        run: |
          cat > src/components/PlayerComparisons.jsx <<'EOF'
          export default function PlayerComparisons() {
            return (
              <section className="home-section">
                <div className="section-heading">
                  <div>
                    <p className="eyebrow">PLAYER INSIGHTS</p>
                    <h2>Player Comparisons</h2>
                  </div>
                </div>
                <div className="card">
                  <p className="muted">Player comparison tools will appear here.</p>
                </div>
              </section>
            );
          }
          EOF

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          node --check server/server.js
          node --check server/routes/profileSecurity.js
          node --check server/routes/profileRequests.js

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove gallery and likes features"
          git push
