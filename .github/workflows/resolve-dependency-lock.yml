name: Resolve compatible dependency security fixes

on:
  push:
    branches:
      - hardening/reliability-security-performance

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/hardening/reliability-security-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/reliability-security-performance
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Update compatible dependency resolutions without changing major versions
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high
      - name: Commit lockfile updates if any
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile already matches the audited tree."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update lockfile with compatible security fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
