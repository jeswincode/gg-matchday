<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071b29" />
    <title>GG · You're offline</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#071b29;color:#f3f0e6}
      *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#173b42,#071b29 68%)}
      main{width:min(100%,440px);text-align:center;padding:36px 28px;border:1px solid #b697514d;border-radius:24px;background:#091d28e8;box-shadow:0 24px 80px #0007}
      .mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:18px;background:#d6b465;color:#071b29;font-weight:1000;font-size:25px}
      h1{font-size:28px;margin:0 0 12px}p{line-height:1.6;color:#bdc9c5;margin:0 0 24px}button{border:0;border-radius:12px;background:#d6b465;color:#071b29;padding:13px 20px;font-weight:800;font-size:14px;cursor:pointer}
    </style>
  </head>
  <body><main><div class="mark">GG</div><h1>You're off the pitch for a moment.</h1><p>GG needs a connection to sync your Worlds, matches and membership. Reconnect and try again.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
